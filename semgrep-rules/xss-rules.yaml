rules:

  # ============================================================
  # RULE 1 (BACKEND - CRITICAL)
  # ReviewEntity: field comment lưu trực tiếp không có sanitize
  # ============================================================
  - id: stored-xss-unsanitized-entity-field
    patterns:
      - pattern: |
          @Column(...)
          private String $FIELD;
      - pattern-not: |
          @SafeHtml(...)
          @Column(...)
          private String $FIELD;
      - pattern-not: |
          @Pattern(...)
          @Column(...)
          private String $FIELD;
    message: >
      [CRITICAL - Stored XSS] Field '$FIELD' được lưu vào database mà không qua
      sanitize. Attacker có thể inject script độc hại vào field này.
      Khuyến nghị: Dùng Jsoup.clean() hoặc OWASP Java HTML Sanitizer trước khi lưu.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-79
      owasp: A03:2021 - Injection
      confidence: HIGH

  # ============================================================
  # RULE 2 (BACKEND - CRITICAL)
  # ReviewServiceImpl: lưu comment từ request thẳng vào entity
  # ============================================================
  - id: stored-xss-direct-save-without-sanitize
    patterns:
      - pattern: |
          $REPO.save(
            $ENTITY.builder()
              .$FIELD($REQ.$METHOD())
              .build()
          );
      - pattern-not: |
          $REPO.save(
            $ENTITY.builder()
              .$FIELD(Jsoup.clean($REQ.$METHOD(), ...))
              .build()
          );
      - pattern-not: |
          $REPO.save(
            $ENTITY.builder()
              .$FIELD(Encode.forHtml($REQ.$METHOD()))
              .build()
          );
      - pattern-not: |
          $REPO.save(
            $ENTITY.builder()
              .$FIELD(sanitize($REQ.$METHOD()))
              .build()
          );
    message: >
      [CRITICAL - Stored XSS] Dữ liệu từ request '$REQ.$METHOD()' được lưu thẳng
      vào database qua builder pattern mà không qua bước sanitize.
      Khuyến nghị: .comment(Jsoup.clean(reviewReq.comment(), Safelist.none()))
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-79
      owasp: A03:2021 - Injection
      confidence: HIGH

  # ============================================================
  # RULE 3 (BACKEND - HIGH)
  # Controller nhận @RequestBody không có @Valid/@Validated
  # ============================================================
  - id: stored-xss-controller-no-input-validation
    patterns:
      - pattern: |
          public $RET $METHOD(@RequestBody $TYPE $PARAM) {
            $SERVICE.$CALL($PARAM);
            ...
          }
      - pattern-not: |
          public $RET $METHOD(@Valid @RequestBody $TYPE $PARAM) {
            ...
          }
      - pattern-not: |
          public $RET $METHOD(@Validated @RequestBody $TYPE $PARAM) {
            ...
          }
    message: >
      [HIGH - Stored XSS] Controller nhận @RequestBody '$PARAM' và gọi service
      mà không có @Valid/@Validated để validate input.
      Khuyến nghị: Thêm @Valid trước @RequestBody.
    languages: [java]
    severity: WARNING
    metadata:
      category: security
      cwe: CWE-79
      owasp: A03:2021 - Injection
      confidence: MEDIUM

  # ============================================================
  # RULE 4 (FRONTEND - CRITICAL)
  # Dùng generic mode để scan .vue files như plain text
  # Phát hiện v-html="xxx.yyy" — dạng object.field (API data)
  # File liên quan: component chứa review-item__comment
  # ============================================================
  - id: stored-xss-v-html-api-data
    pattern: 'v-html="$OBJ.$FIELD"'
    message: >
      [CRITICAL - Stored XSS] Directive v-html đang render '$OBJ.$FIELD' từ API
      response trực tiếp mà không sanitize. Script độc hại sẽ được thực thi
      trong trình duyệt người dùng.
      Khuyến nghị: Dùng DOMPurify.sanitize() hoặc thay bằng {{ }} để render text thuần.
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - "*.vue"
    metadata:
      category: security
      cwe: CWE-79
      owasp: A03:2021 - Injection
      confidence: HIGH

  # ============================================================
  # RULE 5 (FRONTEND - HIGH)
  # Bắt rộng hơn: bất kỳ v-html nào với biến động
  # ============================================================
  - id: stored-xss-v-html-dynamic-content
    patterns:
      - pattern: 'v-html="$EXPR"'
      - pattern-not: 'v-html="DOMPurify.sanitize($EXPR)"'
      - pattern-not: 'v-html="sanitize($EXPR)"'
    message: >
      [HIGH - Stored XSS] Directive v-html đang render nội dung động '$EXPR'
      mà không qua sanitize. Nếu '$EXPR' chứa dữ liệu từ user hoặc API,
      đây là điểm XSS tiềm năng.
      Khuyến nghị: Luôn sanitize trước khi dùng v-html.
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - "*.vue"
    metadata:
      category: security
      cwe: CWE-79
      owasp: A03:2021 - Injection
      confidence: MEDIUM